name: COOMIDEC

on:
  push:
    branches: [main]
    paths: ['coomidec/**', '.github/workflows/coomidec.yml']
  pull_request:
    paths: ['coomidec/**', '.github/workflows/coomidec.yml']

defaults:
  run:
    working-directory: coomidec

jobs:
  verifier:
    name: Typecheck et tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coomidec
          POSTGRES_PASSWORD: coomidec
          POSTGRES_DB: coomidec_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://coomidec:coomidec@localhost:5432/coomidec_test
      JWT_SECRET: secret-de-test-uniquement-pour-la-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coomidec/package-lock.json

      - run: npm ci

      - name: Migrations
        run: npm run migrate --workspace @coomidec/api

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  navigateur:
    name: TEST 1 — hors ligne dans un vrai navigateur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coomidec/package-lock.json

      - run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
        working-directory: coomidec/apps/web

      - name: Critères de validation navigateur
        run: npm run e2e --workspace @coomidec/web
